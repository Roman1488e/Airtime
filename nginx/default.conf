# Default server for IP requests
server {
    listen 80 default_server;
    server_name _;
    return 444;  # Close connection without response
}

# Redirect HTTP to HTTPS for all domains
server {
    listen 80;
    server_name airtime.uz www.airtime.uz admin.airtime.uz api.airtime.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri; # HTTP dan HTTPS ga yo‘naltirish
    }
}

# =========================
# airtime.uz (frontend) - main domain
# =========================
server {
    listen 443 ssl;
    server_name airtime.uz www.airtime.uz;

    ssl_certificate /etc/letsencrypt/live/airtime.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airtime.uz/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://airtime-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

